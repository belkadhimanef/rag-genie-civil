[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rag-genie-civil"
version = "0.1.0"
description = "Hierarchical RAG architecture for civil engineering standards (Eurocode 2 / ACI 318)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "rag", "retrieval-augmented-generation", "eurocode", "civil-engineering",
    "nlp", "llm", "chromadb", "sentence-transformers", "hierarchical-chunking",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/belkadhimanef/rag-genie-civil"
Issues     = "https://github.com/belkadhimanef/rag-genie-civil/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["structrag*"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
